<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery Store Login</title>
  <link rel="stylesheet" href="bootstrap v4/css/bootstrap.min.css">

<style>

body{
font-family: Arial;
background-color: aliceblue;
}

.login-box{
width:350px;
margin:auto;
margin-top:80px;
background:white;
padding:25px;
border-radius:8px;
box-shadow:0px 0px 10px gray;
}

h2{
text-align:center;
}

input{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:10px;
box-sizing: border-box;
}

button{
width:100%;
padding:10px;
background:green;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

button:hover{
background:darkgreen;
}

.error{
color:red;
font-size:14px;
}

</style>

<script>

function login(){

let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

document.getElementById("eerror").innerHTML="";
document.getElementById("perror").innerHTML="";

let valid=true;

let pattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

if(!pattern.test(email)){
document.getElementById("eerror").innerHTML="Enter valid email";
valid=false;
}

if(pass.length<6){
document.getElementById("perror").innerHTML="Password must be 6 characters";
valid=false;
}

if(valid){
alert("Login Successful");
window.location="items.html";
}

}

</script>

</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <a href="#" class="navbar-brand font-weight-bold">Grocery Store</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a href="INDEX.HTML" class="nav-link"> Home </a></li>
                <li class="nav-item"><a href="register.html" class="nav-link"> Register </a></li>
            </ul>
        </div>
    </nav>
<div class="login-box">

<h2>Login</h2>

Email
<input type="text" id="email">
<div id="eerror" class="error"></div>

Password
<input type="password" id="pass">
<div id="perror" class="error"></div>

<br>

<button onclick="login()">Login</button>

</div>

</body>
</html>
