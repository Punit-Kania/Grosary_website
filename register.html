<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery Store Registration</title>
  <link rel="stylesheet" href="bootstrap v4/css/bootstrap.min.css">



<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>

body{
font-family: Arial;
background-color:aliceblue;
}

.form-box{
width:400px;
margin:auto;
margin-top:60px;
background:white;
padding:25px;
border-radius:8px;
box-shadow:0px 0px 10px gray;
}

h2{
text-align:center;
}

input,select{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:10px;
box-sizing: border-box;
}

button{
width:100%;
padding:10px;
background:green;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

button:hover{
background:darkgreen;
}

.error{
color:red;
font-size:14px;
}


</style>

<script>

$(document).ready(function(){

$("#regForm").submit(function(e){

e.preventDefault();

$(".error").text("");

let valid=true;

let name=$("#name").val();
let email=$("#email").val();
let pass=$("#pass").val();
let mobile=$("#mobile").val();
let city=$("#city").val();

if(name.length<3){
$("#nerror").text("Enter valid name");
valid=false;
}

let pattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

if(!pattern.test(email)){
$("#eerror").text("Enter valid email");
valid=false;
}

if(pass.length<6){
$("#perror").text("Password must be at least 6 characters");
valid=false;
}

if(mobile.length!=10){
$("#merror").text("Enter valid mobile number");
valid=false;
}

if(city==""){
$("#cerror").text("Select city");
valid=false;
}

if(valid){
alert("Registration Successful");
$("#regForm")[0].reset();
}

});

});

</script>

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <a href="#" class="navbar-brand font-weight-bold">Grocery Store </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a href="INDEX.HTML" class="nav-link"> Home </a></li>
        <li class="nav-item"><a href="Login.html" class="nav-link"> Login </a></li>
      </ul>
    </div>
  </nav>

<div class="form-box">

<h2>Registration Form</h2>

<form id="regForm">

Full Name
<input type="text" id="name">
<div id="nerror" class="error"></div>

Email
<input type="text" id="email">
<div id="eerror" class="error"></div>

Password
<input type="password" id="pass">
<div id="perror" class="error"></div>

Mobile Number
<input type="text" id="mobile">
<div id="merror" class="error"></div>

City
<select id="city">
<option value="">Select City</option>
<option>Surat</option>
<option>Ahmedabad</option>
<option>Vadodara</option>
<option>Rajkot</option>
</select>
<div id="cerror" class="error"></div>

<br>

<button type="submit">Register</button>

</form>

</div>

</body>
</html>
